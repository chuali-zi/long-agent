# kyagent —— OpenAI 协议兼容 后端配置示例
#
# ⚠️ 部署说明（2026-05-22）：
#   本文件保留作为「OpenAI 协议兼容层」的多后端架构示例，方便未来扩展。
#   **当前阶段生产部署仅推荐 DeepSeek 一个真实后端**（见 configs/deepseek.yaml）。
#   其他 OpenAI 协议兼容服务（智谱 GLM / 通义千问 / vLLM / Ollama / Azure OpenAI 等）
#   代码协议层面能跑，但**不在当前推广范围内**。
#   龙芯（LoongArch Old World）不要安装 openai SDK extra；如需 OpenAI 协议兼容端点，
#   使用 llm_backend=openai_httpx / deepseek_httpx / qwen_httpx 的纯 httpx 路径。
#
# 用法（OpenAI 官方端点）：
#   export OPENAI_API_KEY=sk-...
#   export KYAGENT_CONFIG=$(pwd)/configs/openai.yaml
#   kyagent ask "哪个进程 CPU 占用最高？"
#
# 接 DeepSeek 请直接用 `configs/deepseek.yaml`，无需通过这个文件。
agent:
  name: kyagent
  llm_backend: openai
  openai:
    # 默认走 gpt-4o-mini；通过环境变量覆盖以便快速切换
    model: ${KYAGENT_OPENAI_MODEL:-gpt-4o-mini}
    max_tokens: 20480
    temperature: 0.2
    api_key_env: OPENAI_API_KEY
    # 留空 → 走官方 https://api.openai.com/v1
    base_url: ${KYAGENT_OPENAI_BASE_URL:-}
    # 仅 OpenAI 官方多组织账户需要
    organization: ${KYAGENT_OPENAI_ORG:-}
  max_iterations: 40

executor:
  account: ${KYAGENT_EXECUTOR_ACCOUNT:-kyagent}
  timeout: 30
  output_cap: 65536
  forbid_root: true
  path:
    - /usr/local/bin
    - /usr/bin
    - /bin
    - /usr/sbin
    - /sbin

safety:
  rules_file: configs/safety-rules.yaml
  policy:
    critical: deny
    high: confirm
    medium: confirm
    low: allow
  llm_review: false

audit:
  # 生产部署：通过 KYAGENT_AUDIT_DB / KYAGENT_AUDIT_JSONL 覆盖到 /var/lib/kyagent、/var/log/kyagent
  # （这两个目录由 setup-sudoers.sh 创建并归属 kyagent 账户，可直接写入）。
  database: ${KYAGENT_AUDIT_DB:-./var/audit.db}
  jsonl_file: ${KYAGENT_AUDIT_JSONL:-./var/audit.jsonl}
  retain_days: 90
  integrity_enabled: ${KYAGENT_AUDIT_INTEGRITY_ENABLED:-false}
  hmac_key_file: ${KYAGENT_AUDIT_HMAC_KEY_FILE:-}
  hmac_key_id: ${KYAGENT_AUDIT_HMAC_KEY_ID:-local-v1}

rca:
  playbooks_file: configs/rca-playbooks.yaml

planning:
  enabled: true
  database: ${KYAGENT_PLAN_DB:-./var/plans.db}

mcp:
  enable_tools: []
  plugin_entry_points: []
  server_name: kyagent
  server_version: 0.1.0
