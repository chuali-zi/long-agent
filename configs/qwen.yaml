# kyagent —— 通义千问（Qwen / DashScope）后端配置
#
# ⚠️ 部署说明（2026-05-22）：
#   本文件保留作为「OpenAI 协议兼容层 + Qwen preset」的多后端架构示例。
#   **当前阶段生产部署不推荐 Qwen 后端**；唯一推广的国产真实后端是 DeepSeek
#   （见 configs/deepseek.yaml）。本文件可用于离线 / 自研环境的能力验证。
#   LoongArch Old World 如需 Qwen，应走 llm_backend=qwen_httpx，避免 openai SDK 依赖。
#
# 用法：
#   1. 申请 key：https://bailian.console.aliyun.com  （国内）
#                或 https://modelstudio.console.alibabacloud.com  （海外）
#   2. export DASHSCOPE_API_KEY=sk-...
#   3. export KYAGENT_CONFIG=$(pwd)/configs/qwen.yaml
#   4. kyagent ask "sshd 服务状态？"
#
# 不设 DASHSCOPE_API_KEY 时会直接报错；离线演示请显式设置 llm_backend=mock。
#
# 2026-05 验证信息：
#   - DashScope 提供 OpenAI 协议兼容端点（不必装 dashscope 包，pip install openai 足够）
#   - 国内 base_url:  https://dashscope.aliyuncs.com/compatible-mode/v1
#   - 新加坡 base_url:https://dashscope-intl.aliyuncs.com/compatible-mode/v1
#   - 美东 base_url:  https://dashscope-us.aliyuncs.com/compatible-mode/v1
#   - 注意：key 不可跨区，区域与账户注册地一致
#   - 模型 ID:  qwen-plus（默认）/ qwen3-max / qwen3-coder-plus / qwen3-32b 等
#   - tools/function calling 走 Hermes-style，OpenAI 协议 tool_calls 字段
agent:
  name: kyagent
  llm_backend: qwen
  fallback_to_mock: false
  qwen:
    # qwen-plus：性价比挡，tools 支持完整
    # qwen3-max：旗舰
    # qwen3-coder-plus：偏代码/工具调用任务
    model: ${KYAGENT_QWEN_MODEL:-qwen-plus}
    max_tokens: 20480
    temperature: 0.2
    api_key_env: DASHSCOPE_API_KEY
    # 留空走国内 dashscope.aliyuncs.com；海外用户改成 -intl 或 -us
    base_url: ${KYAGENT_QWEN_BASE_URL:-}
  max_iterations: 40

executor:
  account: ${KYAGENT_EXECUTOR_ACCOUNT:-kyagent}
  timeout: 30
  output_cap: 65536
  forbid_root: true
  path:
    - /usr/local/bin
    - /usr/bin
    - /bin
    - /usr/sbin
    - /sbin

safety:
  rules_file: configs/safety-rules.yaml
  policy:
    critical: deny
    high: confirm
    medium: confirm
    low: allow
  llm_review: false

audit:
  # 生产部署：通过 KYAGENT_AUDIT_DB / KYAGENT_AUDIT_JSONL 覆盖到 /var/lib/kyagent、/var/log/kyagent
  # （这两个目录由 setup-sudoers.sh 创建并归属 kyagent 账户，可直接写入）。
  database: ${KYAGENT_AUDIT_DB:-./var/audit.db}
  jsonl_file: ${KYAGENT_AUDIT_JSONL:-./var/audit.jsonl}
  retain_days: 90
  integrity_enabled: ${KYAGENT_AUDIT_INTEGRITY_ENABLED:-false}
  hmac_key_file: ${KYAGENT_AUDIT_HMAC_KEY_FILE:-}
  hmac_key_id: ${KYAGENT_AUDIT_HMAC_KEY_ID:-local-v1}

rca:
  playbooks_file: configs/rca-playbooks.yaml

mcp:
  enable_tools: []
  plugin_entry_points: []
  server_name: kyagent
  server_version: 0.1.0
