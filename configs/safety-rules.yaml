# kyagent 安全规则库 —— "二次过滤"由这里驱动。
#
# 字段：
#   id           : 规则唯一标识
#   risk         : low / medium / high / critical
#   description  : 人类可读描述
#   pattern      : 在完整 cmdline 上做的正则匹配（与下面 argv 字段是 OR 关系，但同一条规则内部所有非空字段是 AND）
#   command      : argv[0] basename（如 rm）
#   flags_any    : 出现任一即匹配（如 ["-rf", "-fr"]）
#   flags_all    : 全部出现才匹配
#   target_in    : 任一 positional 参数落在这些前缀路径下（含通配 /*）
#   forbid_env   : 不允许在 cmdline 中出现这些环境变量传参形式（如 LD_PRELOAD=）
#
# 命中即取最高 risk；策略层把 risk -> allow/confirm/deny。

rules:
  # ---- 文件销毁类 -----------------------------------------------------
  - id: rm-recursive-system
    risk: critical
    description: 递归删除关键系统目录
    command: rm
    flags_any: ["-rf", "-fr", "-r", "-R", "--recursive"]
    # 注意：不要在这里放 "/"，由 dangerous-rm-pattern 单独覆盖根删除；
    # /tmp 等临时目录刻意排除在外，避免误伤合理清理任务。
    target_in:
      - "/etc"
      - "/usr"
      - "/var"
      - "/boot"
      - "/lib"
      - "/lib64"
      - "/bin"
      - "/sbin"
      - "/opt"
      - "/home"
      - "/root"
      - "/sys"
      - "/proc"
      - "/dev"
      - "/srv"

  - id: rm-no-preserve-root
    risk: critical
    description: 显式禁用 --preserve-root 保护以删除 /
    command: rm
    flags_all: ["--no-preserve-root"]

  - id: dangerous-rm-pattern
    risk: critical
    description: 经典 rm -rf / 写法或其变体（含 \\, 空格混淆）
    pattern: '(?i)\brm\s+-[a-zA-Z]*r[a-zA-Z]*f[a-zA-Z]*\s+/(?:\s|$|\\)'

  - id: rm-wildcard-root
    risk: high
    description: rm -rf /* 通配符删除
    pattern: '(?i)\brm\s+-[a-zA-Z]*r[a-zA-Z]*f[a-zA-Z]*\s+/\*'

  # ---- 写入块设备 -----------------------------------------------------
  - id: dd-of-blockdev
    risk: critical
    description: dd 写入物理/虚拟块设备
    pattern: '\bdd\b[^|;]*\bof=/dev/(sd[a-z]\d*|nvme\d|hd[a-z]\d*|vda\d*|xvd[a-z]\d*|mapper/)'

  - id: mkfs-on-disk
    risk: critical
    description: 在磁盘上重建文件系统
    pattern: '\bmkfs(\.[a-z0-9]+)?\b\s+(/dev/sd|/dev/nvme|/dev/vd|/dev/xvd|/dev/mapper)'

  - id: write-to-blockdev
    risk: critical
    description: 重定向输出到块设备
    pattern: '>\s*/dev/(sd[a-z]\d*|nvme\d|hd[a-z]\d*|vd[a-z]\d*)'

  # ---- 权限破坏 -------------------------------------------------------
  - id: chmod-777-system
    risk: high
    description: 对系统目录开放 777 权限
    command: chmod
    flags_any: ["-R", "--recursive"]
    target_in: ["/etc", "/usr", "/var", "/bin", "/sbin", "/lib", "/lib64", "/boot", "/"]

  - id: chmod-777-pattern
    risk: high
    description: chmod 7?7 通配性赋权（包含 world-writable）
    pattern: '\bchmod\s+[-R]*\s*[0-7]?7[0-7]7\b'

  - id: chown-recursive-system
    risk: high
    description: 递归修改系统目录所有者
    command: chown
    flags_any: ["-R", "--recursive"]
    target_in: ["/etc", "/usr", "/var", "/bin", "/sbin", "/lib", "/boot", "/"]

  # ---- 账户/认证 ------------------------------------------------------
  - id: shadow-write
    risk: critical
    description: 直接修改 /etc/shadow 或 /etc/passwd
    pattern: '>\s*/etc/(shadow|passwd|sudoers)\b'

  - id: userdel-system
    risk: high
    description: 删除系统默认账户
    pattern: '\buserdel\b\s+(root|bin|daemon|sys|adm|nobody|systemd-\w+)'

  - id: passwd-non-interactive
    risk: high
    description: 非交互式批量改密
    pattern: '\bchpasswd\b|\bpasswd\s+--stdin\b'

  # ---- 网络远程脚本 ---------------------------------------------------
  - id: pipe-to-shell
    risk: high
    description: 从网络下载脚本并直接管道到 shell
    pattern: '(curl|wget|fetch)\b[^|;]*\|\s*(bash|sh|zsh|ksh|dash)\b'

  - id: reverse-shell
    risk: critical
    description: 经典反弹 shell 写法
    pattern: '(?:bash\s+-i\s+>&?\s*/dev/tcp/|nc\b[^;|]*\s-e\b\s*/bin/(?:bash|sh)|mkfifo\b[^;|]*\s*\|\s*(?:bash|sh)\s+-i)'

  # ---- 防火墙/SELinux 关闭 ---------------------------------------------
  - id: iptables-flush
    risk: high
    description: 清空 iptables 规则
    pattern: '\biptables\b[^|;]*\s(-F|--flush)\b'

  - id: ufw-disable
    risk: medium
    description: 关闭 UFW 防火墙
    pattern: '\bufw\b\s+disable\b'

  - id: setenforce-permissive
    risk: high
    description: 关闭 SELinux 强制模式
    pattern: '\bsetenforce\s+0\b|\bSELINUX=disabled\b'

  # ---- 关键进程 -------------------------------------------------------
  - id: kill-init
    risk: critical
    description: 杀掉 init/systemd
    pattern: '\bkill\b\s+-9\s+1\b|\bkillall\s+(systemd|init)\b'

  - id: fork-bomb
    risk: critical
    description: fork bomb
    pattern: ':\(\)\s*\{\s*:\|:\&\s*\}\s*;\s*:'

  - id: systemctl-mask-critical
    risk: high
    description: mask 关键服务（ssh / network / login）
    pattern: '\bsystemctl\s+(?:mask|disable)\b\s+(sshd?|networkd?|NetworkManager|systemd-logind)\b'

  # ---- 内核模块/虚拟文件系统 ------------------------------------------
  - id: insmod-modprobe
    risk: high
    description: 装载/卸载内核模块
    pattern: '\b(insmod|rmmod|modprobe)\b'

  - id: sysctl-rewrite
    risk: medium
    description: 改写 /proc/sys 内核参数
    pattern: '>\s*/proc/sys/'

  # ---- 注入/混淆 ------------------------------------------------------
  - id: ld-preload-injection
    risk: high
    description: LD_PRELOAD 注入运行
    pattern: '\bLD_PRELOAD\s*='

  - id: history-cover
    risk: medium
    description: 清空历史 / 关 HISTFILE，疑似掩盖痕迹
    pattern: '\bhistory\s+-c\b|\bunset\s+HISTFILE\b|HISTFILE\s*=\s*/dev/null'

  - id: base64-pipe-shell
    risk: high
    description: base64 解码后直接执行
    pattern: '\bbase64\b[^|;]*-d[^|;]*\|\s*(bash|sh)\b|\becho\s+[A-Za-z0-9+/=]{40,}\s*\|\s*base64\s+-d\s*\|\s*(bash|sh)'

  - id: eval-from-env
    risk: high
    description: 从环境变量 eval 任意代码
    pattern: '\beval\s+["'']?\$\{?[A-Z_]+'

  # ---- 等价删除 / 等价覆写（绕过 rm 的常见姿势） ----------------------
  - id: truncate-critical-file
    risk: critical
    description: 用 truncate 截断关键账户/认证/启动文件
    pattern: '\btruncate\b[^|;]*\s+/etc/(passwd|shadow|gshadow|sudoers|group|ssh/sshd_config|fstab|crypttab|hosts)\b|\btruncate\b[^|;]*\s+/boot/'

  - id: shred-critical-target
    risk: critical
    description: shred 销毁关键文件 / 系统目录
    command: shred
    target_in: ["/etc", "/usr", "/var", "/boot", "/lib", "/lib64", "/bin", "/sbin", "/root", "/home", "/dev"]

  - id: cp-devnull-overwrite
    risk: critical
    description: 通过 cp /dev/null / cp /dev/zero 等空源覆盖关键文件
    pattern: '\bcp\b[^|;]*\s+/dev/(null|zero)\s+/(etc|boot|root|home)/|\bcp\b[^|;]*\s+/dev/(null|zero)\s+/etc/(passwd|shadow|sudoers|fstab|hosts)'

  - id: tee-overwrite-critical
    risk: critical
    description: 用 tee 覆盖关键文件（绕过 > 重定向规则）
    pattern: '\|\s*(sudo\s+)?tee\s+(--?[a-z]+\s+)*/etc/(passwd|shadow|sudoers|gshadow|ssh/sshd_config|fstab|crypttab|hosts)\b|\|\s*(sudo\s+)?tee\s+(--?[a-z]+\s+)*/boot/'

  - id: install-overwrite-critical
    risk: critical
    description: install(1) 替换关键文件（具备 chmod/chown 副作用）
    pattern: '\binstall\b[^|;]*\s+/etc/(passwd|shadow|sudoers|ssh/sshd_config)\b'

  - id: find-delete-system
    risk: critical
    description: find ... -delete 递归删除关键目录
    command: find
    flags_any: ["-delete"]
    target_in: ["/etc", "/usr", "/var", "/boot", "/lib", "/lib64", "/bin", "/sbin", "/opt", "/home", "/root", "/sys", "/proc", "/dev", "/srv"]

  - id: find-exec-rm-system
    risk: critical
    description: find ... -exec rm（用 find 绕过 rm 规则的常见姿势）
    pattern: '\bfind\b[^|;]*\s(/etc|/usr|/var|/boot|/lib|/lib64|/bin|/sbin|/home|/root|/sys|/proc|/dev|/srv|/opt)[^|;]*\s-(?:exec|execdir|ok|okdir)\s+(rm|unlink|shred|mv)\b'

  # ---- 移动 / 重命名 关键目录（等价删除） -----------------------------
  - id: mv-system-directory
    risk: critical
    description: 把关键系统目录 mv 到别处（等同删除）
    command: mv
    target_in: ["/etc", "/usr", "/var", "/boot", "/lib", "/lib64", "/bin", "/sbin", "/root", "/home", "/sys", "/proc", "/dev"]

  # ---- 关键服务 stop/kill（不仅是 mask/disable） ----------------------
  - id: systemctl-stop-critical
    risk: high
    description: 停止 / 杀掉关键服务（sshd / network / firewalld / auditd 等）
    pattern: '\bsystemctl\b\s+(?:stop|kill)\b\s+(sshd?|networkd?|NetworkManager|systemd-logind|firewalld|auditd|chronyd|ntpd|crond?|kylin-\w+)\b'

  - id: service-stop-critical
    risk: high
    description: 用旧 service 命令停掉关键服务
    pattern: '\bservice\s+(sshd?|networkd?|firewalld|auditd|chronyd|ntpd|crond?)\s+(stop|kill)\b'

  # ---- nftables / firewall-cmd / ufw（补齐 iptables 之外的防火墙） ---
  - id: nft-flush-ruleset
    risk: high
    description: nft flush ruleset / 清空 nftables 规则
    pattern: '\bnft\b[^|;]*\s+(flush\s+ruleset|delete\s+table)\b'

  - id: firewall-cmd-shutdown
    risk: high
    description: firewall-cmd 关闭防火墙或清空规则
    pattern: '\bfirewall-cmd\s+(--permanent\s+)?(--reload|--complete-reload|--reset-to-defaults|--remove-service=ssh|--panic-on|--panic-off)\b|\bsystemctl\s+(stop|disable|mask)\s+firewalld\b'

  - id: ufw-reset
    risk: high
    description: ufw reset 重置所有规则（等同清空）
    pattern: '\bufw\s+(reset|--force\s+reset)\b'

  # ---- 计划任务 -------------------------------------------------------
  - id: crontab-remove-all
    risk: high
    description: crontab -r 清空当前用户/指定用户所有计划任务
    pattern: '\bcrontab\b\s+(-u\s+\S+\s+)?-r\b'

  # ---- LVM / 分区表 ---------------------------------------------------
  - id: lvm-vg-destroy
    risk: critical
    description: 销毁卷组 / 逻辑卷 / 物理卷
    pattern: '\b(lvremove|vgremove|pvremove)\b[^|;]*\s(-f|--force|--yes)\b|\b(vgchange\s+-an|vgreduce\s+--removemissing)\b'

  - id: partition-table-edit
    risk: critical
    description: parted / fdisk / sgdisk 非交互式改分区表
    pattern: '\bparted\b[^|;]*\s+(mkpart|rm|mklabel|resizepart)\b|\bsgdisk\b[^|;]*\s+(-Z|-o|--zap-all|--clear)|\bfdisk\b[^|;]*\s+--script\b'

  # ---- 包管理：移除关键包 ---------------------------------------------
  - id: pkg-remove-critical
    risk: critical
    description: 卸载内核 / sshd / systemd / glibc 等关键包（容忍 -y/-q 等夹在子命令前的 flag）
    pattern: '\b(dnf|yum|rpm|apt|apt-get)\b[^|;]*?(\bremove\b|\berase\b|\bpurge\b|\s-e\b)[^|;]*\b(kernel|kernel-core|systemd|glibc|openssh-server|openssh-clients|sudo|polkit|dbus|network-manager|NetworkManager|firewalld|selinux-policy)\b'

  # ---- 关键 sink：无论何种 binary，写入这些路径都至少 critical ------
  # 这是一条"目标地板"规则：覆盖任何未列出的等价改写姿势（cat > / python -c 直写等）
  - id: critical-target-write
    risk: critical
    description: 任何形式的写入指向账户库 / sudoers / boot / sshd_config / fstab
    pattern: '(>{1,2}|--output[= ]|-o\s+|--write-to[= ]|--file[= ])\s*/etc/(passwd|shadow|gshadow|sudoers(?:\.d/\S*)?|ssh/sshd_config|fstab|crypttab)\b|(>{1,2}|--output[= ])\s*/boot/'

  # sed -i / awk -i / perl -pi 单独成规则（修改时跟在 -i 之后的不是路径而是脚本）
  - id: sed-inplace-critical
    risk: critical
    description: sed -i 原地修改关键账户/认证/启动文件
    pattern: '\bsed\b\s+(--in-place\b|-i\b|-i[a-zA-Z0-9.]+\b)[^|;]*\s+/etc/(passwd|shadow|gshadow|sudoers(?:\.d/\S*)?|ssh/sshd_config|fstab|crypttab|hosts|resolv\.conf)\b|\bsed\b\s+(-i\b|--in-place\b)[^|;]*\s+/boot/'

  - id: awk-inplace-critical
    risk: critical
    description: awk -i inplace / gawk inplace 改写关键文件（gawk extension）
    pattern: '\b(g?awk)\b\s+-i\s+inplace\b[^|;]*\s+/etc/(passwd|shadow|gshadow|sudoers(?:\.d/\S*)?|ssh/sshd_config|fstab)\b'

  - id: perl-inplace-critical
    risk: critical
    description: perl -pi -e 原地改写关键文件
    pattern: '\bperl\b\s+-[pn]?i[a-zA-Z]*\b[^|;]*\s+/etc/(passwd|shadow|sudoers|ssh/sshd_config|fstab)\b|\bperl\b\s+-i[^|;]*\s+/boot/'
