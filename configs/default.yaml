# kyagent 默认配置。可通过环境变量 KYAGENT_CONFIG 指向其他文件。
agent:
  name: kyagent
  # 后端：mock / anthropic / openai / deepseek / qwen /
  #       openai_httpx / deepseek_httpx / qwen_httpx
  # 默认走真实 DeepSeek httpx 后端；缺 DEEPSEEK_API_KEY 时直接报错。
  # 离线演示请显式设置 KYAGENT_LLM_BACKEND=mock。
  # 项目根 kyagent.json 仅允许覆盖 llm_backend，不读取任何 key。
  llm_backend: ${KYAGENT_LLM_BACKEND:-deepseek_httpx}
  fallback_to_mock: false
  anthropic:
    model: claude-opus-4-7
    max_tokens: 4096
    api_key_env: ANTHROPIC_API_KEY
  max_iterations: 8

executor:
  # 受限运行账户。若不存在则降级为当前用户但限制 sudoers 白名单
  account: ${KYAGENT_EXECUTOR_ACCOUNT:-kyagent}
  # 全局命令超时（秒）
  timeout: 30
  # 单次输出截断字节
  output_cap: 65536
  # 是否禁止任何 root 权限提升（除显式白名单 sudo 命令外）
  forbid_root: true
  # PATH 白名单（防注入）
  path:
    - /usr/local/bin
    - /usr/bin
    - /bin
    - /usr/sbin
    - /sbin

safety:
  rules_file: configs/safety-rules.yaml
  # 全局策略：deny > confirm > allow
  policy:
    critical: deny
    high: confirm
    medium: confirm
    low: allow
  # 启用 LLM 二级审查器（需要 LLM 后端可用）
  llm_review: false

audit:
  # SQLite 审计数据库路径。
  # 默认走 ./var/audit.db（开发环境写在项目根的 var/）；
  # 部署到 /opt/kyagent 后由非特权 kyagent 账户运行时，相对路径会落到 /opt/kyagent/var/，
  # 该目录由 root/部署用户持有，kyagent 写不进去；
  # 此时在 /etc/kyagent/env 或 systemd EnvironmentFile 里设置 KYAGENT_AUDIT_DB 覆盖为绝对路径
  # （建议 /var/lib/kyagent/audit.db，setup-sudoers.sh 已创建并归属 kyagent）。
  database: ${KYAGENT_AUDIT_DB:-./var/audit.db}
  # 是否同时输出 JSONL 日志（便于外部 SIEM 抽取）；同上，可用 KYAGENT_AUDIT_JSONL 覆盖
  jsonl_file: ${KYAGENT_AUDIT_JSONL:-./var/audit.jsonl}
  # 保留事件天数
  retain_days: 90
  # 生产部署应开启 HMAC 链封印；安装脚本会生成仅运行账户可读的本地 key 文件。
  integrity_enabled: ${KYAGENT_AUDIT_INTEGRITY_ENABLED:-false}
  hmac_key_file: ${KYAGENT_AUDIT_HMAC_KEY_FILE:-}
  hmac_key_id: ${KYAGENT_AUDIT_HMAC_KEY_ID:-local-v1}

rca:
  playbooks_file: configs/rca-playbooks.yaml

mcp:
  # 暴露的工具白名单（空则全部启用）
  enable_tools: []
  # 仅加载显式允许的第三方 entry point；默认完全禁用。
  plugin_entry_points: []
  # stdio 协议握手 banner
  server_name: kyagent
  server_version: 0.1.0
