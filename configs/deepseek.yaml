# kyagent —— DeepSeek 后端配置（赛题鼓励的国产开源大模型路径）
#
# 用法：
#   1. 申请 key：https://platform.deepseek.com  （新账户送 5M token）
#   2. export DEEPSEEK_API_KEY=sk-...
#   3. export KYAGENT_CONFIG=$(pwd)/configs/deepseek.yaml
#   4. kyagent ask "哪个进程 CPU 占用最高？"
#
# 不设 DEEPSEEK_API_KEY 时会自动降级到 mock（CLI 启动 banner 会提示）；
# 想禁掉降级（生产/CI），把 agent.fallback_to_mock 改成 false。
#
# 两条传输路径（2026-05-22 起，由 KYAGENT_DEEPSEEK_TRANSPORT 切换）：
#   - deepseek         (默认)：走 OpenAIBackend，依赖 openai SDK
#                              适用：Windows / macOS / x86_64 Linux 等能正常 pip install openai 的平台
#   - deepseek_httpx          ：走 HttpxBackend，零 openai SDK 依赖，纯 httpx 直发 HTTP
#                              适用：龙芯 LoongArch Old World 等装不上 jiter Rust 的平台
#                              详见 implementation-notes.html "P-OPENAI-DEPS 已解决方案"
# 两条路径在协议层完全等价；切换不影响 Agent.core / tools 行为。
#
# 2026-05 验证信息：
#   - 官方走 OpenAI 协议兼容（无独立 SDK；可选 pip install openai，或走 httpx）
#   - base_url:  https://api.deepseek.com  （/v1 是兼容别名，不必加）
#   - 模型 ID:   deepseek-v4-flash  / deepseek-v4-pro
#   - tools/function calling 与 OpenAI 完全一致（response.tool_calls）
#   - 注意：legacy 别名 deepseek-chat / deepseek-reasoner 在 2026-07-24 退役
agent:
  name: kyagent
  # 默认走 SDK 路径；龙芯部署在环境里 export KYAGENT_DEEPSEEK_TRANSPORT=deepseek_httpx 切到 httpx
  llm_backend: ${KYAGENT_DEEPSEEK_TRANSPORT:-deepseek}
  fallback_to_mock: true
  deepseek:
    # 定价（2026-05 官方 pricing 页核对，单位：每 1M tokens 人民币）：
    #   deepseek-v4-flash：tools 完整支持、推荐主力
    #     input ¥1（cache miss）/ ¥0.02（cache hit）；output ¥2
    #   deepseek-v4-pro：强推理（thinking 模式默认开启），价格更高
    #     input ¥3（cache miss，2.5 折）/ ¥0.025（cache hit，2.5 折）；output ¥6
    # 完整价格 & 优惠详见 https://api-docs.deepseek.com/zh-cn/quick_start/pricing
    model: ${KYAGENT_DEEPSEEK_MODEL:-deepseek-v4-flash}
    max_tokens: 4096
    temperature: 0.2
    api_key_env: DEEPSEEK_API_KEY
    # 留空走 https://api.deepseek.com；仅在使用反代时填
    base_url: ${KYAGENT_DEEPSEEK_BASE_URL:-}
  max_iterations: 8

executor:
  account: kyagent
  timeout: 30
  output_cap: 65536
  forbid_root: true
  path:
    - /usr/local/bin
    - /usr/bin
    - /bin
    - /usr/sbin
    - /sbin

safety:
  rules_file: configs/safety-rules.yaml
  policy:
    critical: deny
    high: confirm
    medium: confirm
    low: allow
  llm_review: false

audit:
  # 生产部署：通过 KYAGENT_AUDIT_DB / KYAGENT_AUDIT_JSONL 覆盖到 /var/lib/kyagent、/var/log/kyagent
  # （这两个目录由 setup-sudoers.sh 创建并归属 kyagent 账户，可直接写入）。
  database: ${KYAGENT_AUDIT_DB:-./var/audit.db}
  jsonl_file: ${KYAGENT_AUDIT_JSONL:-./var/audit.jsonl}
  retain_days: 90

mcp:
  enable_tools: []
  server_name: kyagent
  server_version: 0.1.0
