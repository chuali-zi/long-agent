# kyagent —— DeepSeek 后端配置（赛题鼓励的国产开源大模型路径）
#
# 用法：
#   1. 申请 key：https://platform.deepseek.com
#   2. export DEEPSEEK_API_KEY=sk-...
#   3. export KYAGENT_CONFIG=$(pwd)/configs/deepseek.yaml
#   4. kyagent ask "哪个进程 CPU 占用最高？"
#
# DeepSeek key 优先读取 DEEPSEEK_API_KEY；也可在项目根 kyagent.json 写
# {"deepseek_api_key": "sk-..."} 或 {"deepseek": {"api_key": "sk-..."}}。
# 两处都没有 key 时会直接报错；离线演示请显式设置 llm_backend=mock。
#
# 两条传输路径（由 KYAGENT_DEEPSEEK_TRANSPORT 切换）：
#   - deepseek         (默认)：走 OpenAIBackend，依赖 openai SDK；非 LoongArch 可用
#                              适用：Windows / macOS / x86_64 Linux 等能正常 pip install openai 的平台
#   - deepseek_httpx          ：走 HttpxBackend，零 openai SDK 依赖，纯 httpx 直发 HTTP
#                              适用：龙芯 LoongArch Old World 等装不上 jiter Rust 的平台
# 同一套 HttpxBackend 也支持 openai_httpx / qwen_httpx；LoongArch 赛题部署默认只推广 deepseek_httpx。
# 两条路径在 kyagent 已覆盖的 Chat Completions + tool_calls 子集上等价；切换不影响 Agent.core / tools 行为。
#
# 2026-05-28 验证信息：
#   - 官方示例使用 OpenAI API 格式（可选 openai SDK，或直接 HTTP）
#   - base_url:  https://api.deepseek.com  （/v1 是兼容别名，不必加）
#   - 模型 ID:   deepseek-v4-flash  / deepseek-v4-pro
#   - tools/function calling 仅按本仓库 HttpxBackend 覆盖的 tool_calls 子集验证
agent:
  name: kyagent
  # 默认走 SDK 路径；龙芯部署必须 export KYAGENT_DEEPSEEK_TRANSPORT=deepseek_httpx 切到 httpx
  llm_backend: ${KYAGENT_DEEPSEEK_TRANSPORT:-deepseek}
  fallback_to_mock: false
  deepseek:
    # 价格和模型列表变化快；部署前看官方 Models & Pricing：
    # https://api-docs.deepseek.com/quick_start/pricing
    model: ${KYAGENT_DEEPSEEK_MODEL:-deepseek-v4-flash}
    max_tokens: 4096
    temperature: 0.2
    api_key_env: DEEPSEEK_API_KEY
    # 运行时也可从项目根 kyagent.json 写入 api_key；环境变量优先级更高。
    # 留空走 https://api.deepseek.com；仅在使用反代时填
    base_url: ${KYAGENT_DEEPSEEK_BASE_URL:-}
  max_iterations: 8

executor:
  account: kyagent
  timeout: 30
  output_cap: 65536
  forbid_root: true
  path:
    - /usr/local/bin
    - /usr/bin
    - /bin
    - /usr/sbin
    - /sbin

safety:
  rules_file: configs/safety-rules.yaml
  policy:
    critical: deny
    high: confirm
    medium: confirm
    low: allow
  llm_review: false

audit:
  # 生产部署：通过 KYAGENT_AUDIT_DB / KYAGENT_AUDIT_JSONL 覆盖到 /var/lib/kyagent、/var/log/kyagent
  # （这两个目录由 setup-sudoers.sh 创建并归属 kyagent 账户，可直接写入）。
  database: ${KYAGENT_AUDIT_DB:-./var/audit.db}
  jsonl_file: ${KYAGENT_AUDIT_JSONL:-./var/audit.jsonl}
  retain_days: 90

mcp:
  enable_tools: []
  server_name: kyagent
  server_version: 0.1.0
