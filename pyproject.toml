[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyagent"
version = "0.1.0"
description = "面向麒麟操作系统的安全智能运维 Agent (A2 赛题作品)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team A2" }]
keywords = ["mcp", "agent", "kylin", "ops", "security", "llm"]

dependencies = [
    # 主依赖必须满足"默认路径零 Rust"约束（含 LoongArch64 Old World）：
    # - pydantic v1 → 纯 Python wheel，绕开 pydantic-core Rust 编译
    # - PyYAML 6.0.1+ → sdist build deps 纯 Python，_yaml C 扩展编译失败时
    #   setup.py 自动回落纯 Python SafeLoader；因此没有必需 C 扩展
    # - httpx<1 → HttpxBackend 用（纯 Python，零 Rust，DeepSeek/Qwen 走 deepseek_httpx）
    # 真实 LLM SDK（anthropic / openai）含 jiter(Rust)，统一移到 [optional-dependencies]
    # 防止通用入口（pip install -e .）在 LoongArch 上意外触发 Rust 编译。
    "pydantic>=1.10.13,<2",
    "PyYAML>=6.0.1,<7",
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0,<4",
    "httpx>=0.23.0,<1",
]

[project.optional-dependencies]
# anthropic Claude backend：含 jiter(Rust)。x86_64/aarch64 直接 pip 装即可。
# LoongArch64 Old World 默认不安装该 extra；如必须启用，先看 docs/deployment/loongarch.md。
anthropic = ["anthropic==0.39.0"]
# openai SDK backend：≥1.40 含 jiter(Rust)。LoongArch 不要直接装；用 HttpxBackend
# (llm_backend=deepseek_httpx / qwen_httpx / openai_httpx) 走纯 httpx 路径。
openai = ["openai>=1.30"]
mcp = ["mcp>=1.0"]
# B/S 架构 Web 服务（赛题要求的 B/S 接入层）。
# fastapi<0.100 锁定是为了兼容 pydantic v1（项目硬约束 — 见 dependencies 注释）。
# uvicorn 标准 wheel 纯 Python，LoongArch 可安装；可选的 [standard] extra 含 uvloop/
# httptools/watchfiles 等 C/Rust 依赖，故不收。
web = [
    "fastapi>=0.95,<0.100",
    "uvicorn>=0.23,<0.30",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
kyagent = "kyagent.cli:app"
kyagent-mcp = "kyagent.mcp.server:main"

[tool.setuptools.packages.find]
include = ["kyagent*"]

[tool.setuptools.package-data]
kyagent = ["web/static/*.html", "web/static/*.css", "web/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
