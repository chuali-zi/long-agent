[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyagent"
version = "0.1.0"
description = "面向麒麟操作系统的安全智能运维 Agent (A2 赛题作品)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team A2" }]
keywords = ["mcp", "agent", "kylin", "ops", "security", "llm"]

dependencies = [
    # 主依赖必须满足"全平台零 Rust 编译"约束（含 LoongArch64 Old World）：
    # - pydantic v1 → 纯 Python wheel，绕开 pydantic-core Rust 编译
    # - PyYAML 6.0.1+ → sdist build deps 纯 Python，_yaml C 扩展编译失败时
    #   setup.py 自动回落纯 Python SafeLoader（详见 DEPLOYMENT-LOONGARCH.md 第 4 节）
    # - httpx<1 → HttpxBackend 用（纯 Python，零 Rust，DeepSeek/Qwen 走 deepseek_httpx）
    # 真实 LLM SDK（anthropic / openai）含 jiter(Rust)，统一移到 [optional-dependencies]
    # 防止通用入口（pip install -e .）在 LoongArch 上意外触发 Rust 编译。
    # 详见 implementation-notes.html "2026-05-23 通用入口防护" 决策条目。
    "pydantic>=1.10.13,<2",
    "PyYAML>=6.0.1,<7",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.23.0,<1",
]

[project.optional-dependencies]
# anthropic Claude backend：含 jiter(Rust)。x86_64/aarch64 直接 pip 装即可；
# LoongArch64 Old World 必须走 DEPLOYMENT-LOONGARCH.md 第 6.4 节"可选 anthropic 步骤"
# 的 `pip install --no-deps` 路径（绕开 jiter 现场 Rust 编译）。
anthropic = ["anthropic==0.39.0"]
# openai SDK backend：≥1.40 含 jiter(Rust)。LoongArch 不要直接装；用 HttpxBackend
# (llm_backend=deepseek_httpx / qwen_httpx / openai_httpx) 走纯 httpx 路径。
openai = ["openai>=1.30"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
kyagent = "kyagent.cli:app"
kyagent-mcp = "kyagent.mcp.server:main"

[tool.setuptools.packages.find]
include = ["kyagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
