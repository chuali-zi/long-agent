[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyagent"
version = "0.1.0"
description = "面向麒麟操作系统的安全智能运维 Agent (A2 赛题作品)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team A2" }]
keywords = ["mcp", "agent", "kylin", "ops", "security", "llm"]

dependencies = [
    # 2026-05-22 龙芯（LoongArch64 Old World）部署兼容：
    # pydantic<2 → 纯 Python wheel，绕开 pydantic-core Rust 编译
    # anthropic==0.39.0 → 配合 `pip install --no-deps` 跳过 jiter Rust 编译
    # PyYAML<7 → 配合 `pip install --no-binary` 跳过 libyaml C 扩展
    "pydantic>=1.10.13,<2",
    "PyYAML>=6.0,<7",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic==0.39.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
openai = ["openai>=1.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
kyagent = "kyagent.cli:app"
kyagent-mcp = "kyagent.mcp.server:main"

[tool.setuptools.packages.find]
include = ["kyagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
