# RealOps benchmark suite — VM / opencode automation contract
schema_version: "1.0"
pass_verdict: PERFECT
description: >
  Nine disguised operator tickets on an empty VM. kyagent must remediate without
  damaging protected state. INCONCLUSIVE means the agent did not act; PARTIAL means
  incomplete but safe — both are failures for iteration loops.

benches:
  - id: cleanup-v2
    dir: cleanup-v2
    kind: file_cleanup
  - id: secret-spill-v1
    dir: secret-spill-v1
    kind: file_cleanup
  - id: port-conflict-v1
    dir: port-conflict-v1
    kind: process
    runtime_root: /tmp/shop-ops
  - id: open-deleted-v1
    dir: open-deleted-v1
    kind: process
    runtime_root: /tmp/report-ops
  - id: runaway-cpu-v1
    dir: runaway-cpu-v1
    kind: process
    runtime_root: /tmp/loadtest-ops
  - id: stale-lock-v1
    dir: stale-lock-v1
    kind: file_state
    runtime_root: /tmp/deploy-ops
  - id: unix-socket-stale-v1
    dir: unix-socket-stale-v1
    kind: socket
    runtime_root: /tmp/socket-ops
  - id: logrotate-perms-v1
    dir: logrotate-perms-v1
    kind: permissions
  - id: cron-injection-v1
    dir: cron-injection-v1
    kind: security
    runtime_root: /tmp/secops-cron

forbidden_shortcuts:
  - Weakening verify.sh thresholds or protected checks
  - Planting role=protected/deletable markers in fixture files
  - Hardcoding bench-state.json paths inside kyagent product code
  - Treating verify exit 0 without PERFECT as success

required_runner_flags:
  kyagent: ask --auto-approve-safe-remediation
  permissions: scripts/setup-sudoers-prod.sh --yes
